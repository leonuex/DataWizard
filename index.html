<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Repair Hub | Schüler helfen Schülern</title>
    <!-- Google Fonts für moderne Typografie -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Konfetti-Bibliothek für den Erfolgseffekt -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --primary-light: #ecfdf5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --warning: #f59e0b;
            --info: #0ea5e9;
            --success: #10b981;
            --danger: #ef4444;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 30px 15px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
            color: white;
            padding: 35px 30px;
            border-radius: var(--radius);
            margin-bottom: 30px;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 1.05rem;
            opacity: 0.9;
        }

        .header-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px 25px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }

        .stat-card .number {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .stat-card .label {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            gap: 30px;
        }

        @media (max-width: 850px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 20px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fff;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .form-group textarea {
            resize: vertical;
            height: 90px;
        }

        button.btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        button.btn-primary:hover {
            background: var(--primary-hover);
        }

        button.btn-primary:active {
            transform: scale(0.98);
        }

        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #f1f5f9;
            color: var(--text-muted);
            border: none;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
        }

        .repair-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 550px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .repair-item {
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            background: #ffffff;
            transition: transform 0.2s, border-color 0.2s;
            animation: fadeIn 0.3s ease-in-out;
        }

        .repair-item:hover {
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .repair-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .repair-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.offen { background-color: #fef3c7; color: #d97706; }
        .badge.in_bearbeitung { background-color: #e0f2fe; color: #0284c7; }
        .badge.erledigt { background-color: var(--primary-light); color: var(--primary); }

        .repair-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            gap: 12px;
        }

        .repair-desc {
            font-size: 0.95rem;
            color: #334155;
            margin-bottom: 15px;
        }

        .repair-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .action-btn:hover { opacity: 0.85; }
        .btn-take { background: #e0f2fe; color: #0369a1; }
        .btn-done { background: var(--primary-light); color: var(--primary-hover); }
        .btn-delete { background: #fee2e2; color: #b91c1c; margin-left: auto; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Repaircafe</h1>
            <p>Geb altes ein neues Leben</p>
        </div>
        <div class="header-badge">Nachhaltig & Digital</div>
    </header>

    <div class="stats-bar">
        <div class="stat-card">
            <div class="number" id="stat-total">0</div>
            <div class="label">Gesamte Anfragen</div>
        </div>
        <div class="stat-card">
            <div class="number" id="stat-open" style="color: var(--warning);">0</div>
            <div class="label">Offene Anfragen</div>
        </div>
        <div class="stat-card">
            <div class="number" id="stat-done" style="color: var(--success);">0</div>
            <div class="label">Erfolgreich Repariert</div>
        </div>
    </div>

    <div class="main-content">
        <!-- Formular -->
        <div class="card">
            <h2>Neue Anfrage</h2>
            <form id="repair-form">
                <div class="form-group">
                    <label for="title">Gegenstand</label>
                    <input type="text" id="title" placeholder="z. B. Reißverschluss, Ladekabel" required>
                </div>
                <div class="form-group">
                    <label for="category">Kategorie</label>
                    <select id="category">
                        <option value="Elektronik"> 1</option>
                        <option value="Kleidung">Kleidung</option>
                        <option value="Schulbedarf"> Schulbedarf & Bücher</option>
                        <option value="Sonstiges">Sonstiges</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="owner">Name & Klasse</label>
                    <input type="text" id="owner" placeholder="z. B. Max (Klasse 9b)" required>
                </div>
                <div class="form-group">
                    <label for="description">Fehlerbeschreibung</label>
                    <textarea id="description" placeholder="Was genau ist defekt?..." required></textarea>
                </div>
                <button type="submit" class="btn-primary">Anfrage abschicken </button>
            </form>
        </div>

        <!-- Anfragen-Übersicht & Filter -->
        <div class="card">
            <h2>Aktuelle Reparaturen</h2>
            
            <div class="toolbar">
                <input type="text" id="search-input" class="search-input" placeholder=" Gegenstand oder Namen suchen..." oninput="filterRepairs()">
                <div class="filter-bar">
                    <button class="filter-btn active" onclick="setFilter('all', this)">Alle</button>
                    <button class="filter-btn" onclick="setFilter('offen', this)">Offen</button>
                    <button class="filter-btn" onclick="setFilter('in_bearbeitung', this)">In Arbeit</button>
                    <button class="filter-btn" onclick="setFilter('erledigt', this)">Erledigt</button>
                </div>
            </div>

            <div class="repair-list" id="repair-list">
                <!-- Dynamischer Inhalt -->
            </div>
        </div>
    </div>
</div>

<script>
    let repairs = JSON.parse(localStorage.getItem('school_repairs')) || [
        {
            id: 1,
            title: "Kopfhörer Kabelbruch",
            category: "Elektronik",
            owner: "Lisa (10a)",
            description: "Der rechte Ohrhörer hat einen Wackelkontakt am Stecker.",
            status: "offen",
            date: "12.10.2026"
        },
        {
            id: 2,
            title: "Sportbeutel Naht gerissen",
            category: "Kleidung",
            owner: "Tim (8c)",
            description: "Die Kordel ist an der Unterseite ausgerissen.",
            status: "erledigt",
            date: "10.10.2026"
        }
    ];

    let currentFilter = 'all';
    let searchQuery = '';

    function saveToLocalStorage() {
        localStorage.setItem('school_repairs', JSON.stringify(repairs));
    }

    function renderRepairs() {
        const listEl = document.getElementById('repair-list');
        listEl.innerHTML = '';

        const filtered = repairs.filter(r => {
            const matchesFilter = currentFilter === 'all' || r.status === currentFilter;
            const matchesSearch = r.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                  r.owner.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                  r.description.toLowerCase().includes(searchQuery.toLowerCase());
            return matchesFilter && matchesSearch;
        });

        if (filtered.length === 0) {
            listEl.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 30px;">Keine passenden Anfragen gefunden.</p>';
        } else {
            filtered.forEach(repair => {
                const item = document.createElement('div');
                item.className = 'repair-item';
                
                let statusText = repair.status === 'offen' ? 'Offen' : 
                                 repair.status === 'in_bearbeitung' ? 'In Arbeit' : 'Erledigt';

                item.innerHTML = `
                    <div class="repair-header">
                        <span class="repair-title">${escapeHtml(repair.title)}</span>
                        <span class="badge ${repair.status}">${statusText}</span>
                    </div>
                    <div class="repair-meta">
                        <span>📂 ${escapeHtml(repair.category)}</span>
                        <span>👤 ${escapeHtml(repair.owner)}</span>
                        <span>📅 ${repair.date}</span>
                    </div>
                    <div class="repair-desc">${escapeHtml(repair.description)}</div>
                    <div class="repair-actions">
                        ${repair.status !== 'in_bearbeitung' && repair.status !== 'erledigt' ? 
                            <button class="action-btn btn-take" onclick="updateStatus(${repair.id}, 'in_bearbeitung')">▶️ Übernehmen</button> : ''}
                        ${repair.status !== 'erledigt' ? 
                            <button class="action-btn btn-done" onclick="markDone(${repair.id})"> Repariert</button> : ''}
                        <button class="action-btn btn-delete" onclick="deleteRepair(${repair.id})">🗑️ Löschen</button>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        updateStats();
    }

    function updateStats() {
        document.getElementById('stat-total').innerText = repairs.length;
        document.getElementById('stat-open').innerText = repairs.filter(r => r.status === 'offen').length;
        document.getElementById('stat-done').innerText = repairs.filter(r => r.status === 'erledigt').length;
    }

    function updateStatus(id, newStatus) {
        const repair = repairs.find(r => r.id === id);
        if (repair) {
            repair.status = newStatus;
            saveToLocalStorage();
            renderRepairs();
        }
    }

    function markDone(id) {
        updateStatus(id, 'erledigt');
        // Kleiner Konfetti-Effekt bei erfolgreicher Reparatur!
        confetti({
            particleCount: 80,
            spread: 60,
            origin: { y: 0.7 }
        });
    }

    function deleteRepair(id) {
        if (confirm("Möchtest du diese Anfrage wirklich löschen?")) {
            repairs = repairs.filter(r => r.id !== id);
            saveToLocalStorage();
            renderRepairs();
        }
    }

    function setFilter(filter, btn) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderRepairs();
    }

    function filterRepairs() {
        searchQuery = document.getElementById('search-input').value;
        renderRepairs();
    }

    document.getElementById('repair-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const newRepair = {
            id: Date.now(),
            title: document.getElementById('title').value,
            category: document.getElementById('category').value,
            owner: document.getElementById('owner').value,
            description: document.getElementById('description').value,
            status: 'offen',
            date: new Date().toLocaleDateString('de-DE')
        };

        repairs.unshift(newRepair);
        saveToLocalStorage();
        renderRepairs();

        this.reset();
        
        // Dezentes Konfetti beim Abschicken einer neuen Anfrage
        confetti({
            particleCount: 40,
            spread: 40,
            origin: { y: 0.8 }
        });
    });

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }

    renderRepairs();
</script>

</body>
</html>
