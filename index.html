<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Repair Hub | Cloud Live</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Konfetti-Bibliothek -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <!-- Mobile Konsole (Eruda) -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --primary-light: #ecfdf5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --warning: #f59e0b;
            --success: #10b981;
            --radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.6; padding: 30px 15px; }
        .container { max-width: 1100px; margin: 0 auto; }
        header {
            background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
            color: white; padding: 35px 30px; border-radius: var(--radius);
            margin-bottom: 30px; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.3);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;
        }
        header h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 8px; }
        .header-badge {
            background: rgba(255, 255, 255, 0.2); padding: 8px 16px; border-radius: 50px;
            font-weight: 600; font-size: 0.9rem; backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 20px 25px; border-radius: var(--radius); border: 1px solid var(--border); text-align: center; }
        .stat-card .number { font-size: 2.2rem; font-weight: 700; color: var(--primary); margin-bottom: 5px; }
        .stat-card .label { color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }
        .main-content { display: grid; grid-template-columns: 1fr 1.6fr; gap: 30px; }
        @media (max-width: 850px) { .main-content { grid-template-columns: 1fr; } }
        .card { background: var(--card-bg); padding: 25px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
        .card h2 { font-size: 1.25rem; margin-bottom: 20px; color: var(--text); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px 15px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.95rem; background: #fff;
        }
        .form-group textarea { resize: vertical; height: 90px; }
        button.btn-primary {
            background: var(--primary); color: white; border: none; padding: 14px 20px;
            border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 1rem; width: 100%;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); transition: background 0.2s;
        }
        button.btn-primary:hover { background: var(--primary-hover); }
        .toolbar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .search-input { width: 100%; padding: 10px 15px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.9rem; }
        .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn { background: #f1f5f9; color: var(--text-muted); border: none; padding: 6px 12px; font-size: 0.85rem; font-weight: 600; border-radius: 8px; cursor: pointer; }
        .filter-btn.active { background: var(--primary); color: white; }
        .repair-list { display: flex; flex-direction: column; gap: 15px; max-height: 550px; overflow-y: auto; }
        .repair-item { border: 1.5px solid var(--border); border-radius: 12px; padding: 18px; background: #ffffff; }
        .repair-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .repair-title { font-weight: 700; font-size: 1.1rem; }
        .badge { padding: 4px 10px; border-radius: 50px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .badge.offen { background-color: #fef3c7; color: #d97706; }
        .badge.in_bearbeitung { background-color: #e0f2fe; color: #0284c7; }
        .badge.erledigt { background-color: var(--primary-light); color: var(--primary); }
        .repair-meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; display: flex; gap: 12px; flex-wrap: wrap; }
        .repair-desc { font-size: 0.95rem; color: #334155; margin-bottom: 15px; }
        .repair-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .action-btn { padding: 6px 12px; font-size: 0.85rem; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; }
        .btn-take { background: #e0f2fe; color: #0369a1; }
        .btn-done { background: var(--primary-light); color: var(--primary-hover); }
        .btn-delete { background: #fee2e2; color: #b91c1c; margin-left: auto; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>🔧 School Repair Hub</h1>
            <p>Live Cloud-Marktplatz für Reparaturen & Dienstleistungen</p>
        </div>
        <div class="header-badge" id="sync-status">⚡ Cloud Live Sync</div>
    </header>

    <div class="stats-bar">
        <div class="stat-card">
            <div class="number" id="stat-total">0</div>
            <div class="label">Gesamte Anfragen</div>
        </div>
        <div class="stat-card">
            <div class="number" id="stat-open" style="color: var(--warning);">0</div>
            <div class="label">Offene Anfragen</div>
        </div>
        <div class="stat-card">
            <div class="number" id="stat-done" style="color: var(--success);">0</div>
            <div class="label">Erfolgreich Repariert</div>
        </div>
    </div>

    <div class="main-content">
        <!-- Formular -->
        <div class="card">
            <h2>✨ Neue Anfrage erstellen</h2>
            <form id="repair-form">
                <div class="form-group">
                    <label for="title">Gegenstand / Dienstleistung</label>
                    <input type="text" id="title" placeholder="z. B. Handy-Display, Reißverschluss" required>
                </div>
                <div class="form-group">
                    <label for="category">Kategorie</label>
                    <select id="category">
                        <option value="Elektronik">⚡ Elektronik & Handys</option>
                        <option value="Kleidung">👕 Kleidung & Textilien</option>
                        <option value="Schulbedarf">📚 Schulbedarf & Sonstiges</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="owner">Name & Klasse / Kontakt</label>
                    <input type="text" id="owner" placeholder="z. B. Max (Klasse 9b)" required>
                </div>
                <div class="form-group">
                    <label for="reward">Belohnung / Bezahlung (optional)</label>
                    <input type="text" id="reward" placeholder="z. B. 5 € oder Stück Kuchen 🍰">
                </div>
                <div class="form-group">
                    <label for="description">Fehlerbeschreibung</label>
                    <textarea id="description" placeholder="Was genau ist defekt?..." required></textarea>
                </div>
                <button type="submit" class="btn-primary">Anfrage in Cloud veröffentlichen 🚀</button>
            </form>
        </div>

        <!-- Anfragen-Übersicht & Filter -->
        <div class="card">
            <h2>📋 Öffentlicher Marktplatz</h2>
            
            <div class="toolbar">
                <input type="text" id="search-input" class="search-input" placeholder="🔍 Suchen nach Gegenstand oder Name..." oninput="renderRepairs()">
                <div class="filter-bar">
                    <button class="filter-btn active" onclick="setFilter('all', this)">Alle</button>
                    <button class="filter-btn" onclick="setFilter('offen', this)">Offen</button>
                    <button class="filter-btn" onclick="setFilter('in_bearbeitung', this)">In Arbeit</button>
                    <button class="filter-btn" onclick="setFilter('erledigt', this)">Erledigt</button>
                </div>
            </div>

            <div class="repair-list" id="repair-list">
                <p style="text-align: center; color: var(--text-muted); padding: 30px;">Lade Daten aus der Cloud...</p>
            </div>
        </div>
    </div>
</div>

<!-- Integrierte Firebase-Logik direkt ohne externe Datei-Abhängigkeiten -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC92GlUyRJM0nlSEUcR7Jgawp8sD8RrI",
      authDomain: "school-repair-hub.firebaseapp.com",
      projectId: "school-repair-hub",
      storageBucket: "school-repair-hub.appspot.com",
      messagingSenderId: "698384234693",
      appId: "1:698384234693:web:9124ff8a42f46c5f658ac"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let repairs = [];
    let currentFilter = 'all';

    const q = query(collection(db, "repairs"));
    onSnapshot(q, (snapshot) => {
        repairs = [];
        snapshot.forEach((docSnap) => {
            repairs.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderRepairs();
    }, (error) => {
        console.error("Fehler beim Laden der Cloud-Daten: ", error);
        const statusEl = document.getElementById('sync-status');
        if (statusEl) statusEl.innerText = "⚠️ Offline / Nur Lokal";
    });

    function renderRepairs() {
        const listEl = document.getElementById('repair-list');
        const searchInput = document.getElementById('search-input');
        const searchQuery = searchInput ? searchInput.value.toLowerCase() : '';
        if (!listEl) return;
        
        listEl.innerHTML = '';

        const filtered = repairs.filter(r => {
            const matchesFilter = currentFilter === 'all' || r.status === currentFilter;
            const titleMatch = r.title ? r.title.toLowerCase().includes(searchQuery) : false;
            const ownerMatch = r.owner ? r.owner.toLowerCase().includes(searchQuery) : false;
            const descMatch = r.description ? r.description.toLowerCase().includes(searchQuery) : false;
            return matchesFilter && (titleMatch || ownerMatch || descMatch);
        });

        if (filtered.length === 0) {
            listEl.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 30px;">Keine Anfragen gefunden.</p>';
        } else {
            filtered.forEach(repair => {
                const item = document.createElement('div');
                item.className = 'repair-item';
                
                let statusText = repair.status === 'offen' ? 'Offen' : 
                                 repair.status === 'in_bearbeitung' ? 'In Arbeit' : 'Erledigt';

                item.innerHTML = `
                    <div class="repair-header">
                        <span class="repair-title">${escapeHtml(repair.title)}</span>
                        <span class="badge ${repair.status}">${statusText}</span>
                    </div>
                    <div class="repair-meta">
                        <span>📂 ${escapeHtml(repair.category)}</span>
                        <span>👤 ${escapeHtml(repair.owner)}</span>
                        ${repair.reward ? `<span>🎁 ${escapeHtml(repair.reward)}</span>` : ''}
                        <span>📅 ${repair.date || 'Gerade eben'}</span>
                    </div>
                    <div class="repair-desc">${escapeHtml(repair.description)}</div>
                    <div class="repair-actions">
                        ${repair.status !== 'in_bearbeitung' && repair.status !== 'erledigt' ? 
                            `<button class="action-btn btn-take" onclick="window.updateRepairStatus('${repair.id}', 'in_bearbeitung')">▶️ Übernehmen</button>` : ''}
                        ${repair.status !== 'erledigt' ? 
                            `<button class="action-btn btn-done" onclick="window.markRepairDone('${repair.id}')">✅ Repariert</button>` : ''}
                        <button class="action-btn btn-delete" onclick="window.removeRepair('${repair.id}')">🗑️ Löschen</button>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        updateStats();
    }

    function updateStats() {
        const totalEl = document.getElementById('stat-total');
        const openEl = document.getElementById('stat-open');
        const doneEl = document.getElementById('stat-done');

        if (totalEl) totalEl.innerText = repairs.length;
        if (openEl) openEl.innerText = repairs.filter(r => r.status === 'offen').length;
        if (doneEl) doneEl.innerText = repairs.filter(r => r.status === 'erledigt').length;
    }

    window.setFilter = function(filter, btn) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        renderRepairs();
    }

    window.renderRepairs = renderRepairs;

    window.updateRepairStatus = async function(id, newStatus) {
        try {
            const docRef = doc(db, "repairs", id);
            await updateDoc(docRef, { status: newStatus });
        } catch (e) {
            console.error("Fehler beim Aktualisieren:", e);
        }
    }

    window.markRepairDone = async function(id) {
        window.updateRepairStatus(id, 'erledigt');
        if (typeof confetti === 'function') {
            confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
        }
    }

    window.removeRepair = async function(id) {
        if (confirm("Möchtest du diese Anfrage wirklich löschen?")) {
            try {
                await deleteDoc(doc(db, "repairs", id));
            } catch (e) {
                console.error("Fehler beim Löschen:", e);
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const repairForm = document.getElementById('repair-form');
        if (repairForm) {
            repairForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                const newRepair = {
                    title: document.getElementById('title').value,
                    category: document.getElementById('category').value,
                    owner: document.getElementById('owner').value,
                    reward: document.getElementById('reward').value,
                    description: document.getElementById('description').value,
                    status: 'offen',
                    date: new Date().toLocaleDateString('de-DE')
                };

                try {
                    await addDoc(collection(db, "repairs"), newRepair);
                    repairForm.reset();
                    if (typeof confetti === 'function') {
                        confetti({ particleCount: 40, spread: 40, origin: { y: 0.8 } });
                    }
                } catch (e) {
                    alert("Fehler beim Speichern in der Cloud: " + e.message);
                }
            });
        }
    });

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
